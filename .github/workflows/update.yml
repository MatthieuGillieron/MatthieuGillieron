name: Update README

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest

    permissions:
      contents: write  # Autoriser le bot à écrire dans le contenu du dépôt

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

      - name: Run the script to update README
        run: python utils/days.py

      - name: Configure git
        run: |
          git config user.name "MorpheusBot"
          git config user.email "MatthieuGillieron@users.noreply.github.com"

      - name: Commit and push changes
        run: |
          git add README.md 
          git commit -m "Reality Shift"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
